<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossing Sunsets™ | The Framework for Elite Care</title>
    
    <style>
        /* Apple-Like Immersive Background */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #006B70 0%, #003a3d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Nav Container */
        .nav-container {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 24px 48px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav-container a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-container a:hover {
            opacity: 1;
        }

        /* Frosted Glass Main Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 64px 48px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            margin-top: 60px;
        }

        .eyebrow {
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #F57C00;
            font-weight: 700;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 16px 0;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Dual Action Buttons */
        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a.btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: transform 0.1s ease, background-color 0.3s ease;
        }

        a.btn:active {
            transform: scale(0.98);
        }

        a.btn-primary {
            background-color: #F57C00;
            color: white;
            border: none;
        }

        a.btn-primary:hover {
            background-color: #e56b00;
        }

        a.btn-secondary {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        a.btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: white;
        }
    </style>
</head>
<body>

    <div class="nav-container">
        <div>CROSSING SUNSETS™</div>
        <a href="partners-portal.html">Provider Login</a>
    </div>

    <div class="glass-card">
        <div class="eyebrow">FRAMEWORK</div>
        <h1>The Benchmark for Elite Care.</h1>
        <p>Better systems. Better outcomes. Make actionable trust visible to every family.</p>
        
        <div class="button-group">
            <!-- Family Routing -->
            <a href="browse-providers.html" class="btn btn-primary">FIND PROVIDERS</a>
            <!-- B2B Lead Routing -->
            <a href="partners-portal.html" class="btn btn-secondary">APPLY FOR CERTIFICATION</a>
        </div>
    </div>

</body>
</html>
